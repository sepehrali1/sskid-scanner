<title>Sskid Script Scanner</title>
<style>
  :root{
    --bg:#07070b; --panel:#120e11; --panel2:#1a1418; --panel3:#251a1f;
    --line:#33232a; --fg:#f0eaeb; --dim:#9d8b90; --dim2:#6e5a61;
    --accent:#e11d2e; --accent2:#ff7a45; --ok:#3ddc97; --warn:#f5b301;
    --bad:#ff5c7a; --console:#050507;
    --ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Tahoma,sans-serif;
    --mono:"Cascadia Mono",Consolas,ui-monospace,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--ui);
            -webkit-text-size-adjust:100%}
  body{min-height:100vh}
  button{font-family:inherit}

  /* ---------------- splash ---------------- */
  #splash{position:fixed;inset:0;z-index:50;background:var(--bg);
          display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:6px;transition:opacity .35s ease;padding:24px}
  #splash.hide{opacity:0;pointer-events:none}
  #splash img{width:min(58vw,230px);height:auto;border-radius:18px;
              filter:drop-shadow(0 10px 30px rgba(225,29,46,.28))}
  #splash h1{margin:16px 0 0;font-size:22px;letter-spacing:.4px}
  #splash p{margin:2px 0 0;color:var(--dim);font-size:13px}
  #splashBar{width:min(72vw,420px);height:8px;background:var(--panel3);border-radius:99px;
             margin-top:26px;overflow:hidden}
  #splashBar i{display:block;height:100%;width:0;border-radius:99px;
               background:linear-gradient(90deg,var(--accent),var(--accent2));
               transition:width .12s linear}
  #splashMsg{margin-top:10px;color:var(--dim);font-size:12.5px;min-height:18px}

  /* ---------------- layout ---------------- */
  .app{max-width:1080px;margin:0 auto;padding:0 12px 96px}
  header.top{position:sticky;top:0;z-index:20;background:rgba(18,14,17,.92);
             backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
             margin:0 -12px 12px;padding:12px 16px;display:flex;align-items:center;gap:12px}
  header.top::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;
                     background:linear-gradient(180deg,var(--accent),var(--accent2))}
  header.top img{width:42px;height:42px;border-radius:12px}
  header.top .t h1{margin:0;font-size:17px;font-weight:700}
  header.top .t p{margin:2px 0 0;font-size:11.5px;color:var(--dim)}
  header.top .spin{margin-inline-start:auto;font-size:12px;color:var(--accent2);white-space:nowrap}

  nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
                  color:var(--dim);border-radius:12px;padding:9px 14px;font-size:13px;
                  cursor:pointer;white-space:nowrap;transition:.15s}
  nav.tabs button:hover{color:var(--fg);border-color:var(--panel3)}
  nav.tabs button.on{background:linear-gradient(180deg,var(--accent),#b31524);color:#fff;
                     border-color:transparent;box-shadow:0 6px 18px rgba(225,29,46,.3)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
        padding:14px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;
           color:var(--dim2);font-weight:700}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grow{flex:1 1 220px;min-width:0}
  .pathbox{background:var(--panel2);border:1px solid var(--line);border-radius:11px;
           padding:10px 12px;font-family:var(--mono);font-size:12.5px;color:var(--fg);
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left}

function detectObfuscator(text){
  const found=[];
  for(const [name,re] of OBF_SIGNATURES){ if(re.test(text)) found.push(name); }
  return found;
}

/* ------------------------------ scan ------------------------------ */
function scanBytes(bytes, displayPath){
  const text=decodeText(bytes);
  const r={};
  r.file=displayPath;
  r.bytes=bytes.length;
  r.sha256=sha256(bytes);
  r.entropy=Number(entropy(bytes).toFixed(3));
  r.printable_ratio=Number(printableRatio(bytes).toFixed(3));
  r.longest_line=longestLine(text);
  r.obfuscators=detectObfuscator(text);

  const findings=[]; let threat=0, capability=0;
  for(const [code,re,kind,weight,note] of RULES){
    const hits=countMatches(re,text);
    if(hits>0){
      if(kind==='threat') threat+=weight; else capability+=weight;
      findings.push({rule:code,kind:kind,hits:hits,weight:weight,note:note});
    }
  }
  const packers=r.obfuscators.filter(o=>HIDING_PACKERS.has(o));
  const opaque=packers.length>0;
  if(opaque){
    threat+=25;
    findings.push({rule:'packed',kind:'threat',hits:packers.length,weight:25,
      note:'packed with '+packers.join(', ')+' — the code inside cannot be read statically'});
  }
  if(r.longest_line>=20000){
    threat+=15;
    findings.push({rule:'single_line',kind:'threat',hits:0,weight:15,
      note:'entire payload on one line (minified or packed)'});
  } else if(r.longest_line>=4000){
    threat+=6;
    findings.push({rule:'long_line',kind:'threat',hits:0,weight:6,
      note:'very long lines (generated or minified code)'});
  }
  if(r.bytes>4096 && r.longest_line/r.bytes>0.9){
    threat+=10;
    findings.push({rule:'one_line_file',kind:'threat',hits:0,weight:10,
      note:'a single line covers almost the whole file'});
  }
  const esc=(text.split('\\').length-1)/Math.max(1,text.length);
  if(esc>0.02 && r.printable_ratio>0.9){
    threat+=10;
    findings.push({rule:'escape_heavy',kind:'threat',hits:Math.trunc(esc*1000),weight:10,
      note:'heavy string escaping (obfuscation style)'});
  }
  if(r.entropy>7.5){
    threat+=10;
    findings.push({rule:'high_entropy',kind:'threat',hits:0,weight:10,
      note:'compressed or encrypted blob'});
  }

  const raw=new Set();
  URL_RE.lastIndex=0;
  let mm;
  while((mm=URL_RE.exec(text))!==null){ raw.add(mm[0]); }
  const urls=Array.from(raw).map(u=>u.replace(/[.,;]+$/,'')).sort();
  r.urls=urls.map(maskWebhook);
  r.domains=Array.from(new Set(urls.map(u=>{
    const m=/^https?:\/\/([^/]+)/i.exec(u); return m?m[1].toLowerCase():'';
  }).filter(Boolean))).sort();
  r.webhook_count=urls.filter(u=>WEBHOOK_RE.test(u)).length;

  const score=Math.min(100, threat+Math.floor(capability/2));
  r.threat=threat; r.capability=capability; r.score=score;
  r.auditable=!opaque;
  r.verdict=score>=60?'DO NOT RUN':(score>=25?'REVIEW':'LOW RISK');
  r.findings=findings;
  r.known=null;
  for(const name in KNOWN_DEFAULT){
    const meta=KNOWN_DEFAULT[name];
    if(meta.sha256===r.sha256 && meta.size===r.bytes) r.known=name;
  }
  return r;
}

function fmtBytes(n){ return n.toLocaleString('en-US'); }

function renderScan(r){
  const out=[];
  out.push('='.repeat(66));
  out.push('FILE      '+r.file);
  out.push('SIZE      '+fmtBytes(r.bytes)+' bytes');
  out.push('SHA256    '+r.sha256);
  out.push('ENTROPY   '+r.entropy.toFixed(3)+' bits/byte    PRINTABLE '+(r.printable_ratio*100).toFixed(1)+'%    LONGEST LINE '+r.longest_line);
  out.push('OBFUSC.   '+(r.obfuscators.length?r.obfuscators.join(', '):'none detected'));
  out.push('AUDITABLE '+(r.auditable?'yes':'no — packed, only metadata is visible'));
  if(r.known) out.push('KNOWN     exact match for "'+r.known+'" (harmless decoy)');
  out.push('VERDICT   '+r.verdict+'   (threat '+r.threat+' + capability '+r.capability+'/2 = '+r.score+'/100)');
  out.push('');
  if(!r.auditable){
    out.push('NOTE      "no findings" here does NOT mean "safe": the payload is packed,');
    out.push('          so the pattern scan cannot see inside it. Treat as unknown code.');
    out.push('');
  }
  if(r.findings.length){
    out.push('FINDINGS');
    for(const f of r.findings){
      const tag=f.kind==='threat'?'THREAT':'can   ';
      const rule=(f.rule+'              ').slice(0,14);
      out.push('  ['+tag+'] +'+rule+' x'+(f.hits+'    ').slice(0,4)+'  '+f.note);
    }
  } else out.push('FINDINGS  none');
  if(r.urls.length){
    out.push('');
    out.push('URLS ('+r.urls.length+', '+r.webhook_count+' webhook)');
    for(const u of r.urls.slice(0,25)) out.push('  '+u);
    if(r.urls.length>25) out.push('  ... '+(r.urls.length-25)+' more');
  }
  out.push('');
  return out.join('\n');
}

/* ------------------------------ strings ------------------------------ */
function decodeLuaEscapes(s){
  return s.replace(/\\x[0-9a-fA-F]{2}|\\\d{1,3}|\\[nrtabfv\\"']/g, tok=>{
    const c=tok[1];
    if(c==='x') return String.fromCharCode(parseInt(tok.slice(2),16));
    if(c>='0'&&c<='9') return String.fromCharCode(parseInt(tok.slice(1),10)%256);
    const map={n:'\n',r:'\r',t:'\t',a:'\x07',b:'\b',f:'\f',v:'\v','\\':'\\','"':'"',"'":"'"};
    return map[c]!==undefined?map[c]:tok;
  });
}
function isPrintable(s){
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); if(c<32||c===127) return false; }
  return true;
}
function extractStrings(bytes,opt){
  const n=Math.max(2,opt.min||4);
  const found=[];
  const re=new RegExp('[\\x20-\\x7e]{'+n+',}','g');
  const ascii=decodeText(bytes);
  let m;
  while((m=re.exec(ascii))!==null){ found.push([m.index,m[0]]); if(found.length>200000) break; }
  if(opt.escapes!==false){
    const text=decodeText(bytes);
    const ere=/(?:\\\d{1,3}|\\x[0-9a-fA-F]{2}|\\[nrtabfv\\"']){3,}/g;
    let e;
    while((e=ere.exec(text))!==null){
      const dec=decodeLuaEscapes(e[0]);
      if(dec.length>=n && isPrintable(dec)) found.push([e.index,dec]);
    }
  }
  found.sort((a,b)=>a[0]-b[0]);
  const seen=new Set(), rows=[];
  const limit=opt.limit||2000, width=opt.width||240;
  for(const [off,s] of found){
    if(opt.grep){ let g; try{ g=new RegExp(opt.grep,'i'); }catch(err){ g=null; } if(g&&!g.test(s)) continue; }
    if(seen.has(s)) continue;
    seen.add(s); rows.push([off,s]);
    if(rows.length>=limit) break;
  }
  const lines=[];
  for(const [off,s] of rows){
    const hex=off.toString(16).padStart(8,'0');
    if(s.length>width) lines.push(hex+'  '+s.slice(0,width)+' … [+'+(s.length-width)+' chars]');
    else lines.push(hex+'  '+s);
  }
  lines.push('');
  lines.push(rows.length+' string(s)');
  return lines.join('\n');
}

/* ------------------------------ urls / batch ------------------------------ */
function urlsFromFiles(files){
  const seen={};
  let nfiles=0;
  for(const f of files){
    const ext=(f.name.match(/\.[^.]+$/)||[''])[0].toLowerCase();
    if(BIN_EXT.has(ext)) continue;
    nfiles++;
    const text=decodeText(f.bytes);
    URL_RE.lastIndex=0; let m;
    while((m=URL_RE.exec(text))!==null){
      const u=m[0].replace(/[.,;]+$/,'');
      (seen[u]=seen[u]||new Set()).add(f.name);
    }
  }
  const keys=Object.keys(seen).sort();
  const lines=[keys.length+' unique URLs from '+nfiles+' files'];
  for(const u of keys){
    const who=Array.from(seen[u]).sort().slice(0,3).join(', ');
    lines.push('  '+maskWebhook(u)+'   <- '+who);
  }
  return lines.join('\n');
}
function batchScan(files,minScore,onProgress){
  const rows=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const ext=(f.name.match(/\.[^.]+$/)||[''])[0].toLowerCase();
    if(BIN_EXT.has(ext)) continue;
    if(f.bytes.length>5_000_000) continue;
    let r; try{ r=scanBytes(f.bytes,f.path||f.name); }catch(e){ continue; }
    if(r.score>=minScore) rows.push(r);
    if(onProgress && (i%20===0)) onProgress(i+1,files.length);
  }
  rows.sort((a,b)=>b.score-a.score);
  const pad=(s,n)=>(s+'').padEnd(n);
  const lines=[pad('SCR',4)+' '+pad('VERDICT',10)+' '+pad('THR',5)+' '+pad('CAP',5)+' '+pad('BYTES',8)+' FILE'];
  for(const r of rows){
    lines.push(pad(r.score,4)+' '+pad(r.verdict,10)+' '+pad(r.threat,5)+' '+pad(r.capability,5)+' '+pad(fmtBytes(r.bytes),8)+' '+(r.file||''));
  }
  lines.push('');
  lines.push(rows.length+' file(s) at or above score '+minScore);
  return lines.join('\n');
}

/* ------------------------------ watch ------------------------------ */
async function watchSlots(onLine){
  let changed=0;
  for(const name in KNOWN_DEFAULT){
    const meta=KNOWN_DEFAULT[name];
    try{
      const res=await fetch(meta.url,{cache:'no-store'});
      const buf=new Uint8Array(await res.arrayBuffer());
      const got=sha256(buf);
      if(got!==meta.sha256){ changed++; onLine('[!!] '+name.padEnd(14)+' CHANGED  '+buf.length+' bytes  '+got); }
      else onLine('[ok] '+name.padEnd(14)+' same     '+buf.length+' bytes');
    }catch(e){ onLine('[?] '+name.padEnd(14)+' unreachable ('+e.message+')'); }
  }
  if(changed) onLine('\n'+changed+' slot(s) changed: new code is queued for everyone who loads them.');
  return changed;
}

/* expose for testing */
window.SskidEngine={scanBytes,renderScan,sha256,sha1,md5,entropy,printableRatio,decodeText,
  extractStrings,urlsFromFiles,batchScan,maskWebhook,decodeLuaEscapes,longestLine};

/* =====================================================================
   UI
   ===================================================================== */
const TABS=[
 ['scan','🔎 بازرسی کامل','امتیاز، حکم، یافته‌ها و URLها'],
 ['hash','#️⃣ هش و آنتروپی','md5 / sha1 / sha256 + آنتروپی'],
 ['strings','🔤 رشته‌ها','بیرون کشیدن متن‌ها + دیکد escape'],
 ['urls','🌐 استخراج URL','همهٔ آدرس‌های فایل‌های انتخابی'],
 ['batch','📁 اسکن چند فایل','همه را اسکن کن، مرتب بر اساس ریسک'],
 ['watch','📡 اسلات‌های آنلاین','چک کردن دو اسلات شناخته‌شده'],
];
const $=id=>document.getElementById(id);
const state={tab:'scan',files:[],busy:false};

function setStatus(a,b){ $('stLeft').textContent=a||''; $('stRight').textContent=b||''; }
function setBusy(on,txt){
  state.busy=on;
  $('btnRun').disabled=on;
  $('busyTxt').textContent=on?(txt||'⏳ در حال بررسی…'):'';
}
function paintOut(text,cls){
  const el=$('out'); el.textContent='';
  const frag=document.createDocumentFragment();
  for(const line of String(text).split('\n')){
    let c='';
    if(/^\s*\[THREAT\]/.test(line)) c='t';
    else if(/^\s*\[can/.test(line)) c='c';
    else if(/^VERDICT/.test(line)) c='h';
    else if(/^\s*(https?|discord)/.test(line)) c='h';
    else if(/^(=====|NOTE|\s)/.test(line)) c='d';
    const sp=document.createElement('span'); sp.className=c; sp.textContent=line+'\n';
    frag.appendChild(sp);
  }
  el.appendChild(frag); el.scrollTop=0;
}
function showVerdict(r){
  const color=r.verdict==='DO NOT RUN'?'var(--bad)':(r.verdict==='REVIEW'?'var(--warn)':'var(--ok)');
  const circ=326.7;
  $('ringFg').style.stroke=color;
  $('ringFg').style.strokeDashoffset=String(circ*(1-r.score/100));
  $('scoreN').textContent=r.score;
  $('scoreN').style.color=color;
  $('vWord').textContent=r.verdict; $('vWord').style.color=color;
  let note;
  if(!r.auditable) note='فایل بسته‌بندی‌شده است؛ داخلش خوانده نشد. «یافته‌ای نبود» یعنی «نتوانستم ببینم»، نه «امن است».';
  else if(r.verdict==='DO NOT RUN') note='کد از راه دور می‌آید/می‌رود یا خودش را پنهان می‌کند. اجرا نکن.';
  else if(r.verdict==='REVIEW') note='یا ناشناخته است یا قابلیت زیادی دارد. خودت بخوان.';
  else note='نشانهٔ مشکوکی پیدا نشد.';
  $('vNote').textContent=note;
  $('thN').textContent=r.threat;
  $('thBar').style.width=Math.min(100,r.threat)+'%';
  $('thBar').style.background=r.threat>=50?'var(--bad)':(r.threat>=20?'var(--warn)':'var(--ok)');
  $('capN').textContent=r.capability;
  $('capBar').style.width=Math.min(100,r.capability)+'%';
  $('capBar').style.background='var(--accent2)';
  const obf=r.obfuscators.length?r.obfuscators.join(', '):'—';
  $('vStats').innerHTML='';
  [['bytes',fmtBytes(r.bytes)+' B'],['entropy',r.entropy.toFixed(2)],
   ['pack',obf],['urls',r.urls.length],['webhook',r.webhook_count]].forEach(([k,v])=>{
    const s=document.createElement('span'); s.textContent=k+': '+v; $('vStats').appendChild(s);
  });
  $('verdict').classList.add('show');
  setStatus(r.verdict,'امتیاز '+r.score+'/100');
}
function hideVerdict(){ $('verdict').classList.remove('show'); }

function buildTabs(){
  const nav=$('tabs'); nav.innerHTML='';
  for(const [key,label,desc] of TABS){
    const b=document.createElement('button');
    b.textContent=label; b.dataset.key=key;
    if(key===state.tab) b.classList.add('on');
    b.onclick=()=>selectTab(key);
    nav.appendChild(b);
  }
}
function selectTab(key){
  state.tab=key;
  for(const b of $('tabs').children) b.classList.toggle('on',b.dataset.key===key);
  const desc=TABS.find(t=>t[0]===key)[2];
  $('optHint').textContent=desc;
  $('fMinScore').classList.toggle('hide',!(key==='batch'));
  $('fMinStr').classList.toggle('hide',!(key==='strings'));
  $('fGrep').classList.toggle('hide',!(key==='strings'));
  hideVerdict();
  setStatus('آماده — '+desc,'');
}

function pickFiles(){
  const inp=$('inpFile'); inp.value='';
  inp.onchange=()=>loadFiles(inp.files);
  inp.click();
}
function pickDir(){
  const inp=$('inpDir'); inp.value='';
  inp.onchange=()=>loadFiles(inp.files);
  inp.click();
}
async function loadFiles(list){
  const arr=Array.from(list||[]);
  if(!arr.length) return;
  setBusy(true,'⏳ خواندن فایل‌ها…');
  const files=[];
  for(const f of arr){
    try{
      const bytes=new Uint8Array(await f.arrayBuffer());
      files.push({name:f.name, path:f.webkitRelativePath||f.name, bytes:bytes, size:f.size});
    }catch(e){}
  }
  state.files=files;
  const box=$('pathBox');
  if(files.length===1){ box.textContent=files[0].path; box.classList.remove('empty'); }
  else{ box.textContent=files.length+' فایل انتخاب شد'; box.classList.remove('empty'); }
  setBusy(false);
  setStatus('آماده','');
}

function needFiles(){
  if(!state.files.length){ setStatus('اول فایل انتخاب کن',''); alert('اول یک فایل یا چند فایل انتخاب کن.'); return false; }
  return true;
}

async function run(){
  if(state.busy) return;
  const tab=state.tab;
  if(tab==='watch'){
    setBusy(true,'⏳ بررسی اسلات‌ها…');
    $('out').textContent='';
    const lines=[];
    await watchSlots(l=>{ lines.push(l); paintOut(lines.join('\n')); });
    setBusy(false); setStatus('تمام',lines[lines.length-1]||''); hideVerdict();
    return;
  }
  if(!needFiles()) return;
  const f=state.files[0];
  setBusy(true,'⏳ در حال بررسی…');
  await new Promise(r=>setTimeout(r,20));
  try{
    if(tab==='scan'){
      const r=scanBytes(f.bytes,f.path||f.name);
      paintOut(renderScan(r)); showVerdict(r);
    } else if(tab==='hash'){
      const t=['file    '+(f.path||f.name),
               'bytes   '+fmtBytes(f.bytes.length),
               'md5     '+md5(f.bytes),
               'sha1    '+sha1(f.bytes),
               'sha256  '+sha256(f.bytes),
               'entropy '+entropy(f.bytes).toFixed(3)].join('\n');
      paintOut(t); hideVerdict(); setStatus('تمام','');
    } else if(tab==='strings'){
      const t=extractStrings(f.bytes,{min:+$('minStr').value||4,grep:$('grep').value.trim()||null,
        escapes:true,limit:3000,width:240});
      paintOut(t); hideVerdict(); setStatus('تمام','');
    } else if(tab==='urls'){
      paintOut(urlsFromFiles(state.files)); hideVerdict(); setStatus('تمام','');
    } else if(tab==='batch'){
      const t=batchScan(state.files,+$('minScore').value||0,(i,n)=>setBusy(true,'⏳ '+(i)+'/'+n));
      paintOut(t); hideVerdict(); setStatus('تمام','');
    }
  }catch(e){
    paintOut('خطا:\n'+e.stack); setStatus('خطا','');
  }
  setBusy(false);
}

function init(){
  buildTabs();
  selectTab('scan');
  $('btnFile').onclick=()=>{ $('inpFile').multiple=false; pickFiles(); };
  $('btnMulti').onclick=()=>{ $('inpFile').multiple=true; pickFiles(); };
  $('btnDir').onclick=pickDir;
  $('btnRun').onclick=run;
  $('btnClear').onclick=()=>{ $('out').textContent=''; hideVerdict(); setStatus('آماده',''); };
  $('btnCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText($('out').textContent); setStatus('کپی شد',''); }catch(e){ setStatus('کپی نشد',''); } };
  $('btnSave').onclick=()=>{
    const blob=new Blob([$('out').textContent],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='sskid-report.txt'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  };
  document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) run(); });

  // splash
  const fill=$('splashFill'), msg=$('splashMsg');
  const steps=[[18,'بارگذاری موتور…'],[46,'آماده‌سازی رابط کاربری…'],[74,'بررسی فایل‌های داخلی…'],[100,'آماده است']];
  let i=0;
  const tick=()=>{
    if(i<steps.length){ fill.style.width=steps[i][0]+'%'; msg.textContent=steps[i][1]; i++; setTimeout(tick,260); }
    else{ setTimeout(()=>{ $('splash').classList.add('hide'); setTimeout(()=>$('splash').remove(),400); },220); }
  };
  setTimeout(tick,260);
