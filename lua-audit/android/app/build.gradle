plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sskid.scanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.sskid.scanner"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// بدون هیچ وابستگی بیرونی: فقط Activity و WebView استاندارد اندروید.
dependencies {
}
